<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balance Hídrico — Grupo DH</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f3;color:#1a1a18;overflow:hidden}
.bar{position:fixed;top:0;left:0;right:0;z-index:1000;background:#f5f5f3;border-bottom:1px solid rgba(0,0,0,.08);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;height:48px}
.bar h1{font-size:15px;font-weight:600}
.upd{font-size:11px;color:#9d9d99;margin-right:8px}
.rbtn{background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:8px;padding:5px 11px;cursor:pointer;font-size:13px;color:#6b6b67}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:1000;background:#f5f5f3;border-top:1px solid rgba(0,0,0,.08);display:flex;height:52px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:10px;color:#9d9d99;gap:2px;border:none;background:none;padding:8px 0}
.tab.on{color:#2563eb}
.tab svg{width:20px;height:20px}
.page{position:fixed;top:48px;left:0;right:0;bottom:52px;display:none}
.page.on{display:block}
.scroll{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 16px}
#map{width:100%;height:100%}
.clbl{font-size:10px;font-weight:700;color:#9d9d99;text-transform:uppercase;letter-spacing:.06em;margin:12px 0 6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:12px;padding:11px 12px;cursor:pointer}
.card.off{opacity:.4}
.ct{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:3px}
.pid{font-size:13px;font-weight:700}
.bdg{font-size:10px;font-weight:600;padding:2px 6px;border-radius:20px}
.bok{background:#e8f5e9;color:#2e7d32}.bw{background:#fff8e1;color:#b45309}
.bdr{background:#fdecea;color:#c62828}.bn{background:#f1f1ef;color:#6b6b67}
.cult-line{font-size:11px;color:#6b6b67;margin-bottom:7px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px}
.sl{font-size:9px;color:#9d9d99;margin-bottom:1px}
.sv{font-size:12px;font-weight:600}.sv.red{color:#c62828}
.divl{border:none;border-top:1px solid rgba(0,0,0,.06);margin:6px 0}
.nx{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#6b6b67}
.dc{font-size:10px;font-weight:700;padding:2px 6px;border-radius:20px}
.tots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px}
.tot{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:12px;padding:10px;text-align:center}
.tl{font-size:9px;color:#9d9d99;margin-bottom:3px}.tv{font-size:18px;font-weight:700}.tu{font-size:9px;color:#9d9d99;margin-top:1px}
.form-card{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:14px;padding:16px;margin-bottom:12px}
.ft{font-size:14px;font-weight:700;margin-bottom:14px}
.fl{display:block;font-size:11px;color:#6b6b67;margin-bottom:5px;font-weight:600}
.fi{width:100%;padding:10px 12px;border:1px solid rgba(0,0,0,.1);border-radius:9px;background:#f9f9f8;color:#1a1a18;font-size:14px;-webkit-appearance:none;margin-bottom:12px}
.sbtn{width:100%;padding:13px;background:#2563eb;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}
.ok-msg{background:#e8f5e9;color:#2e7d32;border-radius:10px;padding:12px;text-align:center;font-size:13px;font-weight:600;margin-top:10px}
.er-msg{background:#fdecea;color:#c62828;border-radius:10px;padding:12px;text-align:center;font-size:13px;margin-top:10px}
/* Popup mapa */
.lp{min-width:160px}
.lp h3{font-size:13px;font-weight:700;margin-bottom:2px}
.lp-sub{font-size:11px;color:#6b6b67;margin-bottom:8px}
.lp-row{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px}
.lp-lbl{color:#9d9d99}
</style>
</head>
<body>

<div class="bar">
  <h1>🌱 Balance Hídrico — Grupo DH</h1>
  <div style="display:flex;align-items:center">
    <span class="upd" id="upd">—</span>
    <button class="rbtn" onclick="refresh()">↻</button>
  </div>
</div>

<div class="page on" id="pg-map">
  <div id="map"></div>
</div>

<div class="page" id="pg-cards">
  <div class="scroll" id="cards-content">Cargando...</div>
</div>

<div class="page" id="pg-carga">
  <div class="scroll">
    <div class="form-card">
      <div class="ft">Cargar Lluvia / Riego</div>
      <label class="fl">Pivot</label>
      <select class="fi" id="f-pivot">
        <option value="">Seleccioná...</option>
        <option>LA_R1</option><option>LA_R2</option><option>LE_RIEGO</option><option>LM_RIEGO</option>
        <option>EP_R1_A</option><option>EP_R1_B</option><option>EP_R1_C</option>
        <option>SJ_R2_A</option><option>SJ_R2_B</option><option>SJ_R2_C</option>
      </select>
      <label class="fl">Fecha</label>
      <input class="fi" type="date" id="f-fecha">
      <label class="fl">Lluvia (mm)</label>
      <input class="fi" type="number" id="f-lluvia" placeholder="0" min="0" step="0.1">
      <label class="fl">Riego aplicado (mm)</label>
      <input class="fi" type="number" id="f-riego" placeholder="0" min="0" step="0.1">
      <button class="sbtn" onclick="guardar()">Guardar</button>
      <div id="carga-msg"></div>
    </div>
    <p style="font-size:11px;color:#9d9d99;text-align:center">Los datos se guardan en Google Sheets.</p>
  </div>
</div>

<div class="tabs">
  <button class="tab on" id="t-map" onclick="goPage('map')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7l6-3 6 3 6-3v13l-6 3-6-3-6 3V7z"/><path d="M9 4v13M15 7v13"/></svg>Mapa
  </button>
  <button class="tab" id="t-cards" onclick="goPage('cards')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Pivots
  </button>
  <button class="tab" id="t-carga" onclick="goPage('carga')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12l7 7 7-7"/></svg>Cargar
  </button>
</div>

<script>
const CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vQ6R4wJj-1DpKka4Zd-0CPEi_JAHfDI7xZWcBcSgC4nJAW_7ex1S-r91elxNShPaQZswrANg7cw-ZKD/pub?gid=628155561&single=true&output=csv";

// Coordenadas reales extraídas de KMZ
const SINGLE={
  "LA_R1":{lat:-37.410993,lon:-61.938805,r:420},
  "LA_R2":{lat:-37.427284,lon:-61.944971,r:280},
  "LE_RIEGO":{lat:-37.651794,lon:-61.870594,r:430},
  "LM_RIEGO":{lat:-37.644442,lon:-61.864526,r:450},
};

// EP R1: A arriba, B abajo-derecha, C abajo-izquierda
const EP_CENTER={lat:-37.454124,lon:-61.582570};
const EP_R=700;
const EP_SECTORS=[
  {id:"EP_R1_A",a0:-60,a1:60},
  {id:"EP_R1_B",a0:60,a1:180},
  {id:"EP_R1_C",a0:180,a1:300},
];

// SJ R2: sector vacío al noreste
const SJ_CENTER={lat:-37.446073,lon:-61.608420};
const SJ_R=860;
const SJ_SECTORS=[
  {id:"SJ_R2_A",a0:315,a1:405},
  {id:"SJ_R2_B",a0:45,a1:135},
  {id:"SJ_R2_C",a0:135,a1:225},
];
const SJ_EMPTY={a0:225,a1:315};

const ALL_IDS=[...Object.keys(SINGLE),...EP_SECTORS.map(s=>s.id),...SJ_SECTORS.map(s=>s.id)];
let pdata={}, leafMap=null, mapLayers=[];

// CSV
function parseCSV(txt){
  const rows=[];let cur=[],f="",q=false;
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(q){if(c==='"'&&txt[i+1]==='"'){f+='"';i++;}else if(c==='"')q=false;else f+=c;}
    else{if(c==='"')q=true;else if(c===','){cur.push(f);f="";}else if(c==='\n'){cur.push(f);rows.push(cur);cur=[];f="";}else if(c!=='\r')f+=c;}
  }
  if(f||cur.length){cur.push(f);rows.push(cur);}
  return rows;
}

async function loadData(){
  try{
    const r=await fetch(CSV+"&nc="+Date.now());
    const txt=await r.text();
    pdata={};
    for(const row of parseCSV(txt)){
      const pid=(row[1]||"").trim();
      if(ALL_IDS.includes(pid))
        pdata[pid]={pid,cult:(row[3]||"").trim(),camp:(row[4]||"").trim(),
          ddc:(row[5]||"").trim(),est:(row[6]||"").trim(),au:(row[7]||"").trim(),
          pct:(row[8]||"").trim(),alerta:(row[9]||"").trim(),
          prox:(row[10]||"").trim(),dias:(row[11]||"").trim()};
    }
    document.getElementById("upd").textContent=new Date().toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
  }catch(e){console.error(e);}
}

function aColor(a){
  if(!a||a==="—"||a==="")return"#9d9d99";
  if(a.includes("REGAR"))return"#c62828";
  if(a.includes("Pronto"))return"#d97706";
  return"#2e7d32";
}
function aFill(a){
  if(!a||a==="—"||a==="")return 0.15;
  if(a.includes("REGAR"))return 0.55;
  if(a.includes("Pronto"))return 0.45;
  return 0.3;
}

function popupHTML(pid){
  const p=pdata[pid]||{pid,cult:"",alerta:""};
  const sin=!p.cult||p.cult.includes("Sin")||p.cult==="—";
  return`<div class="lp">
    <h3>${pid}</h3>
    <div class="lp-sub">${sin?"Sin cultivo":p.cult+(p.ddc?" · DDC "+p.ddc:"")}</div>
    ${sin?"":` 
    <div class="lp-row"><span class="lp-lbl">AU disp.</span><span>${p.au||"—"} mm</span></div>
    <div class="lp-row"><span class="lp-lbl">% AU</span><span>${p.pct||"—"}</span></div>
    <div class="lp-row"><span class="lp-lbl">Estadio</span><span>${p.est||"—"}</span></div>
    <div class="lp-row"><span class="lp-lbl">Prox. riego</span><span>${p.prox||"—"}</span></div>
    <div class="lp-row"><span class="lp-lbl">Días</span><span>${p.dias||"—"}</span></div>`}
  </div>`;
}

// Generar polígono de sector (arco) en lat/lon
function sectorLatLon(centerLat,centerLon,radiusM,startDeg,endDeg){
  const pts=[[centerLat,centerLon]];
  const steps=48;
  for(let i=0;i<=steps;i++){
    const angleDeg=startDeg+(endDeg-startDeg)*i/steps;
    const angleRad=(angleDeg-90)*Math.PI/180; // -90 para Norte=0
    const dLat=radiusM/111320*Math.cos(angleDeg*Math.PI/180);
    const dLon=radiusM/(111320*Math.cos(centerLat*Math.PI/180))*Math.sin(angleDeg*Math.PI/180);
    pts.push([centerLat+dLat,centerLon+dLon]);
  }
  pts.push([centerLat,centerLon]);
  return pts;
}

function initMap(){
  if(leafMap) return;
  leafMap=L.map("map",{zoomControl:true}).setView([-37.52,-61.75],11);
  // Esri World Imagery — satelital, sin CORS issues
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{
    attribution:"Esri",maxZoom:18
  }).addTo(leafMap);
}

function updateMapLayers(){
  mapLayers.forEach(l=>leafMap.removeLayer(l));
  mapLayers=[];

  function addLabel(lat,lon,text,color){
    const icon=L.divIcon({
      html:`<div style="font-size:10px;font-weight:700;color:#fff;background:${color};padding:2px 6px;border-radius:4px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.5);pointer-events:none">${text}</div>`,
      className:"",iconAnchor:[30,0]
    });
    const m=L.marker([lat,lon],{icon,interactive:false}).addTo(leafMap);
    mapLayers.push(m);
  }

  // Pivotes simples
  Object.entries(SINGLE).forEach(([pid,cfg])=>{
    const p=pdata[pid]||{pid,cult:"",alerta:""};
    const col=aColor(p.alerta);
    const c=L.circle([cfg.lat,cfg.lon],{
      radius:cfg.r,color:col,fillColor:col,fillOpacity:aFill(p.alerta),weight:2.5
    }).addTo(leafMap).bindPopup(popupHTML(pid));
    mapLayers.push(c);
    addLabel(cfg.lat,cfg.lon,pid,col);
  });

  // EP R1 sectores
  EP_SECTORS.forEach(s=>{
    const p=pdata[s.id]||{pid:s.id,cult:"",alerta:""};
    const col=aColor(p.alerta);
    const pts=sectorLatLon(EP_CENTER.lat,EP_CENTER.lon,EP_R,s.a0,s.a1);
    const poly=L.polygon(pts,{color:"#fff",fillColor:col,fillOpacity:aFill(p.alerta),weight:2})
      .addTo(leafMap).bindPopup(popupHTML(s.id));
    mapLayers.push(poly);
    const midA=(s.a0+s.a1)/2;
    const lLat=EP_CENTER.lat+(EP_R*0.6/111320)*Math.cos(midA*Math.PI/180);
    const lLon=EP_CENTER.lon+(EP_R*0.6/(111320*Math.cos(EP_CENTER.lat*Math.PI/180)))*Math.sin(midA*Math.PI/180);
    addLabel(lLat,lLon,s.id,col);
  });

  // SJ R2 sectores
  SJ_SECTORS.forEach(s=>{
    const p=pdata[s.id]||{pid:s.id,cult:"",alerta:""};
    const col=aColor(p.alerta);
    const pts=sectorLatLon(SJ_CENTER.lat,SJ_CENTER.lon,SJ_R,s.a0,s.a1);
    const poly=L.polygon(pts,{color:"#fff",fillColor:col,fillOpacity:aFill(p.alerta),weight:2})
      .addTo(leafMap).bindPopup(popupHTML(s.id));
    mapLayers.push(poly);
    const midA=(s.a0+s.a1)/2;
    const lLat=SJ_CENTER.lat+(SJ_R*0.6/111320)*Math.cos(midA*Math.PI/180);
    const lLon=SJ_CENTER.lon+(SJ_R*0.6/(111320*Math.cos(SJ_CENTER.lat*Math.PI/180)))*Math.sin(midA*Math.PI/180);
    addLabel(lLat,lLon,s.id,col);
  });
  // Sector vacío SJ
  const empPts=sectorLatLon(SJ_CENTER.lat,SJ_CENTER.lon,SJ_R,SJ_EMPTY.a0,SJ_EMPTY.a1);
  mapLayers.push(L.polygon(empPts,{color:"#fff",fillColor:"#9d9d99",fillOpacity:0.1,weight:1.5,dashArray:"5,5"}).addTo(leafMap));
}

// Tarjetas
const CAMPOS={
  "La Alcancia":["LA_R1","LA_R2"],
  "La Esquina Biodes":["LE_RIEGO"],
  "La Medialuna":["LM_RIEGO"],
  "San Justo EP R1":["EP_R1_A","EP_R1_B","EP_R1_C"],
  "San Justo R2":["SJ_R2_A","SJ_R2_B","SJ_R2_C"]
};

function bdg(a){
  if(!a||a==="—")return'<span class="bdg bn">Sin siembra</span>';
  if(a.includes("REGAR"))return'<span class="bdg bdr">Regar ya</span>';
  if(a.includes("Pronto"))return'<span class="bdg bw">Pronto</span>';
  return'<span class="bdg bok">OK</span>';
}
function dc(d){
  if(!d||d==="—")return'<span class="dc bn">—</span>';
  const n=parseInt(d);
  if(isNaN(n)||n<=0)return'<span class="dc bdr">Vencido</span>';
  if(n<=7)return'<span class="dc bw">'+n+"d</span>";
  return'<span class="dc bok">'+n+"d</span>";
}

function renderCards(){
  const act=Object.values(pdata).filter(p=>p.cult&&!p.cult.includes("Sin")&&p.cult!=="—");
  const al=act.filter(p=>p.alerta.includes("REGAR")).length;
  let html=`<div class="tots">
    <div class="tot"><div class="tl">Activos</div><div class="tv">${act.length}</div><div class="tu">pivots</div></div>
    <div class="tot"><div class="tl">Estado</div><div class="tv" style="font-size:13px">${al===0?"🟢 OK":"🔴 "+al}</div></div>
    <div class="tot"><div class="tl">Alertas</div><div class="tv" style="color:${al>0?"#c62828":"#2e7d32"}">${al}</div><div class="tu">a regar</div></div>
  </div>`;
  for(const[campo,pids] of Object.entries(CAMPOS)){
    html+=`<div class="clbl">${campo}</div><div class="grid">`;
    pids.forEach(pid=>{
      const p=pdata[pid]||{pid,cult:"",alerta:""};
      const sin=!p.cult||p.cult.includes("Sin")||p.cult==="—";
      const pN=parseFloat((p.pct||"0").replace(",",".").replace("%",""));
      html+=`<div class="card${sin?" off":""}" onclick="focusPivot('${pid}')">
        <div class="ct"><span class="pid">${pid}</span>${bdg(p.alerta)}</div>
        <div class="cult-line">${sin?"Sin cultivo":p.cult+(p.ddc?" · DDC "+p.ddc:"")}</div>
        ${sin?"":`<div class="stats">
          <div><div class="sl">AU disp.</div><div class="sv${pN>0&&pN<45?" red":""}">${p.au||"—"} mm</div></div>
          <div><div class="sl">% AU</div><div class="sv${pN>0&&pN<45?" red":""}">${p.pct||"—"}</div></div>
        </div><div class="divl"></div>
        <div class="nx"><span>${p.prox||"—"}</span>${dc(p.dias)}</div>`}
      </div>`;
    });
    html+=`</div>`;
  }
  document.getElementById("cards-content").innerHTML=html;
}

function focusPivot(pid){
  goPage("map");
  let lat,lon;
  if(SINGLE[pid]){lat=SINGLE[pid].lat;lon=SINGLE[pid].lon;}
  else if(EP_SECTORS.find(s=>s.id===pid)){lat=EP_CENTER.lat;lon=EP_CENTER.lon;}
  else{lat=SJ_CENTER.lat;lon=SJ_CENTER.lon;}
  setTimeout(()=>{leafMap.setView([lat,lon],14);},200);
}

function setToday(){
  const d=new Date();
  document.getElementById("f-fecha").value=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

async function guardar(){
  const pivot=document.getElementById("f-pivot").value;
  const fecha=document.getElementById("f-fecha").value;
  const lluvia=parseFloat(document.getElementById("f-lluvia").value)||0;
  const riego=parseFloat(document.getElementById("f-riego").value)||0;
  const msg=document.getElementById("carga-msg");
  if(!pivot){msg.innerHTML='<div class="er-msg">Seleccioná un pivot</div>';return;}
  if(!fecha){msg.innerHTML='<div class="er-msg">Ingresá una fecha</div>';return;}
  if(!lluvia&&!riego){msg.innerHTML='<div class="er-msg">Ingresá lluvia o riego</div>';return;}
  msg.innerHTML='<div style="color:#9d9d99;text-align:center;padding:12px">Guardando...</div>';
  try{
    const r=await fetch(APPS_SCRIPT_URL,{
      method:"POST",
      body:JSON.stringify({pivot,fecha,lluvia,riego}),
      headers:{"Content-Type":"application/json"}
    });
    const d=await r.json();
    if(d.ok){
      msg.innerHTML=`<div class="ok-msg">✅ Guardado en Sheets<br>${pivot} — ${fecha}<br>Lluvia: ${lluvia}mm · Riego: ${riego}mm</div>`;
      document.getElementById("f-lluvia").value="";
      document.getElementById("f-riego").value="";
      setTimeout(refresh,2000);
    } else {
      msg.innerHTML=`<div class="er-msg">Error: ${d.error||"desconocido"}</div>`;
    }
  }catch(e){
    msg.innerHTML=`<div class="er-msg">Error de conexión: ${e.message}</div>`;
  }
}

function goPage(name){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("on"));
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("on"));
  document.getElementById("pg-"+name).classList.add("on");
  document.getElementById("t-"+name).classList.add("on");
  if(name==="map") setTimeout(()=>leafMap&&leafMap.invalidateSize(),100);
}

async function refresh(){
  await loadData();
  renderCards();
  updateMapLayers();
}

setToday();
initMap();
refresh();
</script>
</body>
</html>
