<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Balance Hídrico — Grupo DH</title>
<style>
:root{
  --bg:#f5f5f3;--sf:#fff;--sf2:#f9f9f8;--bd:rgba(0,0,0,0.08);
  --t:#1a1a18;--t2:#6b6b67;--t3:#9d9d99;--acc:#2563eb;
  --gBg:#e8f5e9;--g:#2e7d32;--yBg:#fff8e1;--y:#f57f17;
  --rBg:#fdecea;--r:#c62828;--grBg:#f1f1ef;--gr:#6b6b67;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1a1a18;--sf:#242422;--sf2:#2c2c2a;--bd:rgba(255,255,255,0.08);
  --t:#f5f5f3;--t2:#9d9d99;--t3:#6b6b67;
  --gBg:#1b3a1c;--g:#66bb6a;--yBg:#3a2e0a;--y:#ffd54f;
  --rBg:#3a1212;--r:#ef5350;--grBg:#2c2c2a;--gr:#9d9d99;
}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--t);padding-bottom:32px}
.bar{position:sticky;top:0;z-index:10;background:var(--bg);padding:14px 16px 10px;border-bottom:0.5px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.bar h1{font-size:16px;font-weight:600}
.btn{background:var(--sf);border:0.5px solid var(--bd);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:12px;color:var(--t2)}
.upd{font-size:11px;color:var(--t3);margin-right:8px}
.content{padding:12px 16px}
.clbl{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
@media(max-width:420px){.grid{grid-template-columns:1fr 1fr;gap:8px}}
.card{background:var(--sf);border:0.5px solid var(--bd);border-radius:12px;padding:12px}
.card.off{opacity:.4}
.ct{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
.pid{font-size:13px;font-weight:600}
.b{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px}
.bok{background:var(--gBg);color:var(--g)}
.bw{background:var(--yBg);color:var(--y)}
.bd2{background:var(--rBg);color:var(--r)}
.bn{background:var(--grBg);color:var(--gr)}
.cult{font-size:11px;color:var(--t2);margin-bottom:10px}
.mx{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px}
.ml{font-size:10px;color:var(--t3);margin-bottom:1px}
.mv{font-size:13px;font-weight:500}
.ac{color:var(--acc)}.rc{color:var(--r)}
hr{border:none;border-top:0.5px solid var(--bd);margin:8px 0}
.nx{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--t2)}
.dc{font-size:11px;font-weight:600;padding:2px 7px;border-radius:20px}
.tots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.tot{background:var(--sf2);border:0.5px solid var(--bd);border-radius:12px;padding:12px;text-align:center}
.tl{font-size:10px;color:var(--t3);margin-bottom:4px}
.tv{font-size:22px;font-weight:600}
.tu{font-size:10px;color:var(--t3);margin-top:2px}
.load{text-align:center;padding:3rem 1rem;color:var(--t3);font-size:14px}
.err{background:var(--rBg);color:var(--r);border-radius:12px;padding:12px;font-size:13px;margin:16px 0;text-align:center}
</style>
</head>
<body>
<div class="bar">
  <h1>🌱 Balance Hídrico — Grupo DH</h1>
  <div style="display:flex;align-items:center">
    <span class="upd" id="upd"></span>
    <button class="btn" onclick="load()">↻ Actualizar</button>
  </div>
</div>
<div class="content" id="root"><div class="load">Cargando...</div></div>
<script>
const CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vQ6R4wJj-1DpKka4Zd-0CPEi_JAHfDI7xZWcBcSgC4nJAW_7ex1S-r91elxNShPaQZswrANg7cw-ZKD/pub?gid=628155561&single=true&output=csv";
const CAMPOS={"LA_R1":"La Alcancia","LA_R2":"La Alcancia","LE_RIEGO":"La Esquina Biodes","LM_RIEGO":"La Medialuna","EP_R1_A":"San Justo EP R1","EP_R1_B":"San Justo EP R1","EP_R1_C":"San Justo EP R1","SJ_R2_A":"San Justo R2","SJ_R2_B":"San Justo R2","SJ_R2_C":"San Justo R2"};
const PIVOTS=Object.keys(CAMPOS);

// Parser CSV robusto
function parseCSV(txt){
  const rows=[];let cur=[],f="",q=false;
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(q){if(c==='"'&&txt[i+1]==='"'){f+='"';i++;}else if(c==='"')q=false;else f+=c;}
    else{if(c==='"')q=true;else if(c===','){cur.push(f);f="";}else if(c==='\n'){cur.push(f);rows.push(cur);cur=[];f="";}else if(c!=='\r')f+=c;}
  }
  if(f||cur.length){cur.push(f);rows.push(cur);}
  return rows;
}

// Normalizar número con coma decimal
function num(s){return parseFloat((s||"0").replace(",",".").replace("%",""))||0;}

function bdg(a){
  if(!a||a==="—"||a==="")return'<span class="b bn">Sin siembra</span>';
  if(a.includes("REGAR"))return'<span class="b bd2">Regar ya</span>';
  if(a.includes("Pronto"))return'<span class="b bw">Pronto</span>';
  return'<span class="b bok">OK</span>';
}
function dc(d){
  if(!d||d==="—"||d==="")return'<span class="dc bn">—</span>';
  const n=parseInt(d);
  if(isNaN(n)||n<=0)return'<span class="dc bd2">Vencido</span>';
  if(n<=7)return'<span class="dc bw">'+n+'d</span>';
  return'<span class="dc bok">'+n+'d</span>';
}

function card(p){
  const sin=!p.cult||p.cult.includes("Sin")||p.cult==="—";
  const pctN=num(p.pct);
  const pctBad=pctN>0&&pctN<45;
  return`<div class="card${sin?' off':''}">
    <div class="ct"><span class="pid">${p.pid}</span>${bdg(p.alerta)}</div>
    <div class="cult">${sin?'Sin cultivo':p.cult+(p.ddc?' · DDC '+p.ddc:'')}</div>
    ${sin?'':`<div class="mx">
      <div><div class="ml">AU disp.</div><div class="mv${pctBad?' rc':''}">${p.au} mm</div></div>
      <div><div class="ml">% AU</div><div class="mv${pctBad?' rc':''}">${p.pct}</div></div>
      <div><div class="ml">Estadio</div><div class="mv" style="font-size:10px">${p.est||'—'}</div></div>
      <div><div class="ml">Campaña</div><div class="mv">${p.camp||'—'}</div></div>
    </div>
    <hr>
    <div class="nx"><span>${p.prox||'—'}</span>${dc(p.dias)}</div>`}
  </div>`;
}

async function load(){
  document.getElementById("upd").textContent="Cargando...";
  try{
    const r=await fetch(CSV+"&nc="+Date.now());
    const txt=await r.text();
    const rows=parseCSV(txt);

    // Buscar filas donde col[1] sea un pivot conocido
    const pivots=[];
    for(const row of rows){
      const pid=(row[1]||"").trim();
      if(PIVOTS.includes(pid)){
        pivots.push({
          pid,
          has:row[2]||"",
          cult:(row[3]||"").trim(),
          camp:(row[4]||"").trim(),
          ddc:(row[5]||"").trim(),
          est:(row[6]||"").trim(),
          au:(row[7]||"").trim(),
          pct:(row[8]||"").trim(),
          alerta:(row[9]||"").trim(),
          prox:(row[10]||"").trim(),
          dias:(row[11]||"").trim()
        });
      }
    }

    if(!pivots.length) throw new Error("No se encontraron pivots en el CSV. Filas recibidas: "+rows.length);

    // Agrupar por campo
    const byCampo={};
    pivots.forEach(p=>{
      const c=CAMPOS[p.pid]||"Otros";
      if(!byCampo[c])byCampo[c]=[];
      byCampo[c].push(p);
    });

    let html="";
    for(const[campo,ps]of Object.entries(byCampo)){
      html+=`<div class="clbl">${campo}</div><div class="grid">`;
      ps.forEach(p=>{html+=card(p);});
      html+=`</div>`;
    }

    const act=pivots.filter(p=>p.cult&&!p.cult.includes("Sin")&&p.cult!=="—");
    let alertas=0;
    act.forEach(p=>{if(p.alerta.includes("REGAR"))alertas++;});

    html+=`<div class="clbl" style="margin-top:20px">Totales grupo</div>
    <div class="tots">
      <div class="tot"><div class="tl">Pivots activos</div><div class="tv">${act.length}</div><div class="tu">de ${pivots.length}</div></div>
      <div class="tot"><div class="tl">Estado general</div><div class="tv" style="font-size:14px">${alertas===0?'🟢 OK':'🔴 '+alertas+' alerta'+(alertas>1?'s':'')}</div></div>
      <div class="tot"><div class="tl">Alertas riego</div><div class="tv" style="color:${alertas>0?'var(--r)':'var(--g)'}">${alertas}</div><div class="tu">pivots</div></div>
    </div>`;

    document.getElementById("root").innerHTML=html;
    document.getElementById("upd").textContent=new Date().toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
  }catch(e){
    document.getElementById("root").innerHTML=`<div class="err">Error: ${e.message}</div>`;
    document.getElementById("upd").textContent="Error";
  }
}
load();
</script>
</body>
</html>
