<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Balance Hídrico — Grupo DH</title>
<style>
:root {
  --bg:#f5f5f3;--surface:#fff;--surface2:#f9f9f8;--border:rgba(0,0,0,0.08);
  --text:#1a1a18;--text2:#6b6b67;--text3:#9d9d99;--accent:#2563eb;
  --gBg:#e8f5e9;--g:#2e7d32;--yBg:#fff8e1;--y:#f57f17;
  --rBg:#fdecea;--r:#c62828;--grBg:#f1f1ef;--gr:#6b6b67;--radius:12px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1a1a18;--surface:#242422;--surface2:#2c2c2a;--border:rgba(255,255,255,0.08);
  --text:#f5f5f3;--text2:#9d9d99;--text3:#6b6b67;
  --gBg:#1b3a1c;--g:#66bb6a;--yBg:#3a2e0a;--y:#ffd54f;
  --rBg:#3a1212;--r:#ef5350;--grBg:#2c2c2a;--gr:#9d9d99;
}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);padding-bottom:32px;min-height:100vh}
.topbar{position:sticky;top:0;z-index:10;background:var(--bg);padding:14px 16px 10px;border-bottom:0.5px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.topbar h1{font-size:16px;font-weight:600}
.btn{background:var(--surface);border:0.5px solid var(--border);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:12px;color:var(--text2)}
.btn:active{opacity:0.7}
.upd{font-size:11px;color:var(--text3);margin-right:8px}
.content{padding:12px 16px}
.campo-lbl{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
@media(max-width:400px){.grid{grid-template-columns:1fr 1fr;gap:8px}}
.card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);padding:12px}
.card.inactive{opacity:.4}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
.pid{font-size:13px;font-weight:600}
.bdg{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px}
.ok{background:var(--gBg);color:var(--g)}
.warn{background:var(--yBg);color:var(--y)}
.danger{background:var(--rBg);color:var(--r)}
.none{background:var(--grBg);color:var(--gr)}
.cult{font-size:11px;color:var(--text2);margin-bottom:10px}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px}
.mlbl{font-size:10px;color:var(--text3);margin-bottom:1px}
.mval{font-size:13px;font-weight:500}
.acc{color:var(--accent)}.red{color:var(--r)}
hr{border:none;border-top:0.5px solid var(--border);margin:8px 0}
.nxt{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--text2)}
.dchip{font-size:11px;font-weight:600;padding:2px 7px;border-radius:20px}
.tots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.tot{background:var(--surface2);border:0.5px solid var(--border);border-radius:var(--radius);padding:12px;text-align:center}
.tlbl{font-size:10px;color:var(--text3);margin-bottom:4px}
.tval{font-size:22px;font-weight:600}
.tunit{font-size:10px;color:var(--text3);margin-top:2px}
.loading{text-align:center;padding:3rem 1rem;color:var(--text3);font-size:14px}
.err{background:var(--rBg);color:var(--r);border-radius:var(--radius);padding:12px;font-size:13px;margin:16px 0;text-align:center}
</style>
</head>
<body>
<div class="topbar">
  <h1>🌱 Balance Hídrico — Grupo DH</h1>
  <div style="display:flex;align-items:center">
    <span class="upd" id="upd"></span>
    <button class="btn" onclick="load()">↻ Actualizar</button>
  </div>
</div>
<div class="content" id="root"><div class="loading">Cargando datos...</div></div>

<script>
const URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ6R4wJj-1DpKka4Zd-0CPEi_JAHfDI7xZWcBcSgC4nJAW_7ex1S-r91elxNShPaQZswrANg7cw-ZKD/pub?gid=628155561&single=true&output=csv";

const CAMPOS = {
  "LA_R1":"La Alcancia","LA_R2":"La Alcancia",
  "LE_RIEGO":"La Esquina Biodes","LM_RIEGO":"La Medialuna",
  "EP_R1_A":"San Justo EP R1","EP_R1_B":"San Justo EP R1","EP_R1_C":"San Justo EP R1",
  "SJ_R2_A":"San Justo R2","SJ_R2_B":"San Justo R2","SJ_R2_C":"San Justo R2"
};

// Parsear CSV robusto — maneja comillas y saltos de línea
function parseCSV(txt) {
  const rows = [];
  let cur = [], field = "", inQ = false;
  for (let i = 0; i < txt.length; i++) {
    const c = txt[i];
    if (inQ) {
      if (c==='"' && txt[i+1]==='"') { field+='"'; i++; }
      else if (c==='"') inQ = false;
      else field += c;
    } else {
      if (c==='"') inQ = true;
      else if (c===',') { cur.push(field.trim()); field=""; }
      else if (c==='\n') { cur.push(field.trim()); rows.push(cur); cur=[]; field=""; }
      else if (c!=='\r') field += c;
    }
  }
  if (field||cur.length) { cur.push(field.trim()); rows.push(cur); }
  return rows;
}

function bdg(a) {
  if (!a||a==="—"||a==="") return '<span class="bdg none">Sin siembra</span>';
  if (a.includes("REGAR")) return '<span class="bdg danger">Regar ya</span>';
  if (a.includes("Pronto")) return '<span class="bdg warn">Pronto</span>';
  return '<span class="bdg ok">OK</span>';
}

function dchip(d) {
  if (!d||d==="—"||d==="") return '<span class="dchip none">—</span>';
  const n=parseInt(d);
  if (isNaN(n)||n<=0) return '<span class="dchip danger">Vencido</span>';
  if (n<=7) return '<span class="dchip warn">'+n+'d</span>';
  return '<span class="dchip ok">'+n+'d</span>';
}

function card(r) {
  // Columnas por índice (0-based):
  // 0=Pivot, 1=Has, 2=Cultivo, 3=Campaña, 4=DDC, 5=Estadio,
  // 6=AU Disp mm, 7=% AU, 8=Prioridad, 9=Próximo riego, 10=Días
  const pid=r[0], has=r[1], cult=r[2], camp=r[3], ddc=r[4];
  const est=r[5], au=r[6], pct=r[7], alerta=r[8], prox=r[9], dias=r[10];
  const sin=!cult||cult==="Sin siembra"||cult.includes("Sin");
  const pctN=parseFloat(pct)*100;
  const pctDisp=isNaN(pctN)?(pct||"—"):Math.round(pctN)+"%";

  return `<div class="card${sin?' inactive':''}">
    <div class="card-top"><span class="pid">${pid}</span>${bdg(alerta)}</div>
    <div class="cult">${sin?'Sin cultivo':cult+(ddc?' · DDC '+ddc:'')}</div>
    ${sin?'<div style="font-size:11px;color:var(--text3);text-align:center;padding:4px 0">Sin cultivo activo</div>':`
    <div class="metrics">
      <div><div class="mlbl">AU disp.</div><div class="mval${parseFloat(pct)<0.45?' red':''}">${au} mm</div></div>
      <div><div class="mlbl">% AU</div><div class="mval${parseFloat(pct)<0.45?' red':''}">${pctDisp}</div></div>
    </div>
    <hr>
    <div class="nxt"><span>Próx: ${prox||'—'}</span>${dchip(dias)}</div>`}
  </div>`;
}

async function load() {
  document.getElementById("upd").textContent = "Cargando...";
  try {
    const res = await fetch(URL+"&nc="+Date.now());
    const txt = await res.text();
    const rows = parseCSV(txt);

    // Encontrar la fila que empieza con "Pivot" — es la fila de headers
    let dataStart = -1;
    for (let i=0; i<rows.length; i++) {
      if (rows[i][0]==="Pivot"||rows[i][1]==="Pivot") { dataStart=i+1; break; }
    }
    // Si no encontró header, buscar la primera fila que tenga un pivot conocido
    if (dataStart < 0) {
      for (let i=0; i<rows.length; i++) {
        if (CAMPOS[rows[i][0]]||CAMPOS[rows[i][1]]) { dataStart=i; break; }
      }
    }
    if (dataStart < 0) throw new Error("No se encontraron datos de pivots en el CSV");

    // Filtrar filas con pivot conocido
    const pivots = rows.slice(dataStart).filter(r => r[0] && (CAMPOS[r[0]]||r[2]));

    // Agrupar por campo
    const porCampo = {};
    pivots.forEach(r => {
      const campo = CAMPOS[r[0]]||"Otros";
      if (!porCampo[campo]) porCampo[campo]=[];
      porCampo[campo].push(r);
    });

    let html="";
    for (const [campo, ps] of Object.entries(porCampo)) {
      html+=`<div class="campo-lbl">${campo}</div><div class="grid">`;
      ps.forEach(r=>{ html+=card(r); });
      html+=`</div>`;
    }

    // Totales
    const act=pivots.filter(r=>r[2]&&!r[2].includes("Sin"));
    let tL=0,tR=0,al=0;
    act.forEach(r=>{
      if((r[8]||"").includes("REGAR")) al++;
    });

    html+=`<div class="campo-lbl" style="margin-top:20px">Totales grupo</div>
    <div class="tots">
      <div class="tot"><div class="tlbl">Lluvia prom.</div><div class="tval">—</div><div class="tunit">mm</div></div>
      <div class="tot"><div class="tlbl">Riego prom.</div><div class="tval">—</div><div class="tunit">mm</div></div>
      <div class="tot"><div class="tlbl">Alertas</div><div class="tval" style="color:${al>0?'var(--r)':'var(--g)'}">${al}</div><div class="tunit">pivots</div></div>
    </div>`;

    document.getElementById("root").innerHTML=html;
    document.getElementById("upd").textContent=new Date().toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
  } catch(e) {
    document.getElementById("root").innerHTML=`<div class="err">Error al cargar: ${e.message}</div>`;
    document.getElementById("upd").textContent="Error";
  }
}
load();
</script>
</body>
</html>
