<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Balance Hídrico — Grupo DH</title>
<style>
:root {
  --bg: #f5f5f3;
  --surface: #ffffff;
  --surface2: #f9f9f8;
  --border: rgba(0,0,0,0.08);
  --text: #1a1a18;
  --text2: #6b6b67;
  --text3: #9d9d99;
  --accent: #2563eb;
  --green-bg: #e8f5e9; --green: #2e7d32;
  --yellow-bg: #fff8e1; --yellow: #f57f17;
  --red-bg: #fdecea; --red: #c62828;
  --gray-bg: #f1f1ef; --gray: #6b6b67;
  --radius: 12px;
  --pad: env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1a18; --surface: #242422; --surface2: #2c2c2a;
    --border: rgba(255,255,255,0.08); --text: #f5f5f3;
    --text2: #9d9d99; --text3: #6b6b67;
    --green-bg: #1b3a1c; --green: #66bb6a;
    --yellow-bg: #3a2e0a; --yellow: #ffd54f;
    --red-bg: #3a1212; --red: #ef5350;
    --gray-bg: #2c2c2a; --gray: #9d9d99;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg); color: var(--text);
  padding-top: calc(var(--pad) + 16px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
  min-height: 100vh;
}
.topbar {
  position: sticky; top: 0; z-index: 10;
  background: var(--bg);
  padding: 12px 16px 8px;
  border-bottom: 0.5px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
}
.topbar h1 { font-size: 16px; font-weight: 600; }
.topbar-right { display: flex; align-items: center; gap: 8px; }
.last-update { font-size: 11px; color: var(--text3); }
.btn-refresh {
  background: var(--surface); border: 0.5px solid var(--border);
  border-radius: 8px; padding: 6px 10px; cursor: pointer;
  font-size: 12px; color: var(--text2); display: flex; align-items: center; gap: 4px;
}
.btn-refresh:active { opacity: 0.7; }
.content { padding: 12px 16px; }
.campo-label {
  font-size: 11px; font-weight: 600; color: var(--text3);
  text-transform: uppercase; letter-spacing: 0.06em;
  margin: 16px 0 8px;
}
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 10px; }
@media (max-width: 400px) { .grid { grid-template-columns: 1fr 1fr; gap: 8px; } }
.card {
  background: var(--surface); border: 0.5px solid var(--border);
  border-radius: var(--radius); padding: 12px;
}
.card.sin-siembra { opacity: 0.45; }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
.pivot-id { font-size: 13px; font-weight: 600; }
.badge {
  font-size: 10px; font-weight: 600; padding: 2px 7px;
  border-radius: 20px;
}
.b-ok { background: var(--green-bg); color: var(--green); }
.b-warn { background: var(--yellow-bg); color: var(--yellow); }
.b-danger { background: var(--red-bg); color: var(--red); }
.b-none { background: var(--gray-bg); color: var(--gray); }
.cultivo-line { font-size: 11px; color: var(--text2); margin-bottom: 10px; }
.metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; }
.metric-label { font-size: 10px; color: var(--text3); margin-bottom: 1px; }
.metric-value { font-size: 13px; font-weight: 500; }
.mv-accent { color: var(--accent); }
.mv-danger { color: var(--red); }
hr { border: none; border-top: 0.5px solid var(--border); margin: 8px 0; }
.next-row { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text2); }
.dias-chip { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 20px; }
.totales {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 10px; margin-top: 8px;
}
.total-card {
  background: var(--surface2); border: 0.5px solid var(--border);
  border-radius: var(--radius); padding: 12px; text-align: center;
}
.total-label { font-size: 10px; color: var(--text3); margin-bottom: 4px; }
.total-value { font-size: 22px; font-weight: 600; }
.total-unit { font-size: 10px; color: var(--text3); margin-top: 2px; }
.loading { text-align: center; padding: 3rem 1rem; color: var(--text3); font-size: 14px; }
.error { background: var(--red-bg); color: var(--red); border-radius: var(--radius); padding: 12px 16px; font-size: 13px; margin: 16px 0; text-align: center; }
.spinning { animation: spin 1s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="topbar">
  <h1>🌱 Balance Hídrico</h1>
  <div class="topbar-right">
    <span class="last-update" id="lastUpdate">—</span>
    <button class="btn-refresh" onclick="cargarDatos()" id="btnRef">↻ Actualizar</button>
  </div>
</div>

<div class="content" id="contenido">
  <div class="loading"><span class="spinning">↻</span><br><br>Cargando datos...</div>
</div>

<script>
const URL_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ6R4wJj-1DpKka4Zd-0CPEi_JAHfDI7xZWcBcSgC4nJAW_7ex1S-r91elxNShPaQZswrANg7cw-ZKD/pub?gid=628155561&single=true&output=csv";

const CAMPOS = {
  "LA_R1":"La Alcancia","LA_R2":"La Alcancia",
  "LE_RIEGO":"La Esquina Biodes","LM_RIEGO":"La Medialuna",
  "EP_R1_A":"San Justo EP R1","EP_R1_B":"San Justo EP R1","EP_R1_C":"San Justo EP R1",
  "SJ_R2_A":"San Justo R2","SJ_R2_B":"San Justo R2","SJ_R2_C":"San Justo R2"
};

function parseCSV(txt) {
  const rows = txt.trim().split("\n");
  const h = rows[0].split(",").map(x => x.replace(/^"|"$/g,"").trim());
  return rows.slice(1).map(row => {
    const v = row.split(",").map(x => x.replace(/^"|"$/g,"").trim());
    const o = {}; h.forEach((k,i) => o[k] = v[i]||"");
    return o;
  }).filter(r => r["Pivot"] && r["Pivot"].length > 0);
}

function badge(alerta) {
  if (!alerta||alerta==="—"||alerta==="") return '<span class="badge b-none">Sin siembra</span>';
  if (alerta.includes("REGAR")) return '<span class="badge b-danger">Regar ya</span>';
  if (alerta.includes("Pronto")) return '<span class="badge b-warn">Pronto</span>';
  return '<span class="badge b-ok">OK</span>';
}

function diasChip(d) {
  if (!d||d==="—"||d==="") return '<span class="dias-chip b-none">—</span>';
  const n = parseInt(d);
  if (isNaN(n)||n<=0) return '<span class="dias-chip b-danger">Vencido</span>';
  if (n<=7) return '<span class="dias-chip b-warn">'+n+'d</span>';
  return '<span class="dias-chip b-ok">'+n+'d</span>';
}

function card(p) {
  const pid = p["Pivot"]||"";
  const cultivo = p["Cultivo"]||"";
  const sin = !cultivo||cultivo==="Sin siembra"||cultivo==="—";
  const ddc = p["DDC\nhoy"]||p["DDC hoy"]||"";
  const estadio = p["Estadio"]||"";
  const au = p["AU Disp\n(mm)"]||p["AU Disp (mm)"]||"—";
  const auPct = p["% AU"]||"";
  const lluvia = p["MM Lluvia\nacumulados"]||p["H"]||"—";
  const riego = p["MM Riego\nacumulados"]||p["I"]||"—";
  const prox = p["Próximo\nriego (fecha)"]||p["Próximo riego (fecha)"]||"—";
  const dias = p["Días\nhasta riego"]||p["Días hasta riego"]||"—";
  const alerta = p["Prioridad\nriego"]||p["Prioridad riego"]||"";
  const pctNum = parseFloat(auPct)*100||parseFloat(auPct)||0;

  return `<div class="card${sin?' sin-siembra':''}">
    <div class="card-top">
      <span class="pivot-id">${pid}</span>
      ${badge(alerta)}
    </div>
    <div class="cultivo-line">${sin?'Sin cultivo':cultivo+(ddc?' · DDC '+ddc:'')}</div>
    ${sin?'':` 
    <div class="metrics">
      <div>
        <div class="metric-label">AU disp.</div>
        <div class="metric-value${pctNum<45?' mv-danger':''}">${au} mm</div>
      </div>
      <div>
        <div class="metric-label">% AU</div>
        <div class="metric-value${pctNum<45?' mv-danger':''}">${auPct}</div>
      </div>
      <div>
        <div class="metric-label">Lluvia acum.</div>
        <div class="metric-value mv-accent">${lluvia} mm</div>
      </div>
      <div>
        <div class="metric-label">Riego acum.</div>
        <div class="metric-value mv-accent">${riego} mm</div>
      </div>
    </div>
    <hr>
    <div class="next-row">
      <span>${prox}</span>
      ${diasChip(dias)}
    </div>`}
  </div>`;
}

async function cargarDatos() {
  const btn = document.getElementById("btnRef");
  btn.innerHTML = '<span class="spinning">↻</span>';
  btn.disabled = true;
  try {
    const r = await fetch(URL_CSV+"&nocache="+Date.now());
    if (!r.ok) throw new Error("HTTP "+r.status);
    const txt = await r.text();
    const pivots = parseCSV(txt);

    const porCampo = {};
    pivots.forEach(p => {
      const c = CAMPOS[p["Pivot"]]||"Otros";
      if (!porCampo[c]) porCampo[c] = [];
      porCampo[c].push(p);
    });

    let html = "";
    for (const [campo, ps] of Object.entries(porCampo)) {
      html += `<div class="campo-label">${campo}</div><div class="grid">`;
      ps.forEach(p => { html += card(p); });
      html += `</div>`;
    }

    // Totales
    const activos = pivots.filter(p => p["Cultivo"]&&p["Cultivo"]!=="Sin siembra"&&p["Cultivo"]!=="—");
    let totLluvia=0, totRiego=0, alertas=0;
    activos.forEach(p => {
      totLluvia += parseFloat(p["MM Lluvia\nacumulados"]||p["H"]||"0")||0;
      totRiego  += parseFloat(p["MM Riego\nacumulados"]||p["I"]||"0")||0;
      if ((p["Prioridad\nriego"]||"").includes("REGAR")) alertas++;
    });
    const n = Math.max(activos.length,1);

    html += `
    <div class="campo-label" style="margin-top:20px">Totales grupo</div>
    <div class="totales">
      <div class="total-card">
        <div class="total-label">Lluvia prom.</div>
        <div class="total-value">${Math.round(totLluvia/n)}</div>
        <div class="total-unit">mm</div>
      </div>
      <div class="total-card">
        <div class="total-label">Riego prom.</div>
        <div class="total-value">${Math.round(totRiego/n)}</div>
        <div class="total-unit">mm</div>
      </div>
      <div class="total-card">
        <div class="total-label">Alertas</div>
        <div class="total-value" style="color:${alertas>0?'var(--red)':'var(--green)'}">${alertas}</div>
        <div class="total-unit">pivots</div>
      </div>
    </div>`;

    document.getElementById("contenido").innerHTML = html;
    document.getElementById("lastUpdate").textContent = new Date().toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
  } catch(e) {
    document.getElementById("contenido").innerHTML = `<div class="error">No se pudo cargar el Sheets.<br><small>${e.message}</small></div>`;
  }
  btn.innerHTML = "↻ Actualizar";
  btn.disabled = false;
}

cargarDatos();
</script>
</body>
</html>
