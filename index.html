<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balance Hídrico — Grupo DH</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f3;color:#1a1a18;overflow:hidden}
.bar{position:fixed;top:0;left:0;right:0;z-index:100;background:#f5f5f3;border-bottom:1px solid rgba(0,0,0,.08);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;height:48px}
.bar h1{font-size:15px;font-weight:600}
.upd{font-size:11px;color:#9d9d99;margin-right:8px}
.btn{background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:8px;padding:5px 11px;cursor:pointer;font-size:12px;color:#6b6b67}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:100;background:#f5f5f3;border-top:1px solid rgba(0,0,0,.08);display:flex;height:52px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:10px;color:#9d9d99;gap:2px;border:none;background:none;padding:8px 0}
.tab.on{color:#2563eb}
.tab svg{width:20px;height:20px}
.page{position:fixed;top:48px;left:0;right:0;bottom:52px;display:none;overflow:hidden}
.page.on{display:block}
.scroll{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 16px}

/* MAPA */
#map-wrap{position:relative;width:100%;height:100%;background:#e8eaed;overflow:hidden}
#map-img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
#map-canvas{position:absolute;top:0;left:0;width:100%;height:100%;cursor:pointer}
.map-ctrl{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:4px;z-index:10}
.map-ctrl button{width:32px;height:32px;background:#fff;border:1px solid rgba(0,0,0,.2);border-radius:6px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.map-legend{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.9);border-radius:8px;padding:8px 10px;font-size:10px;z-index:10}
.leg-row{display:flex;align-items:center;gap:5px;margin-bottom:3px}
.leg-dot{width:10px;height:10px;border-radius:50%}
.map-tooltip{position:absolute;background:#fff;border-radius:10px;padding:10px 12px;box-shadow:0 4px 16px rgba(0,0,0,.18);font-size:12px;min-width:160px;z-index:20;display:none;pointer-events:none}
.tt-title{font-size:13px;font-weight:700;margin-bottom:2px}
.tt-cult{font-size:11px;color:#6b6b67;margin-bottom:6px}
.tt-row{display:flex;justify-content:space-between;margin-bottom:2px}
.tt-lbl{color:#9d9d99}

/* TARJETAS */
.clbl{font-size:10px;font-weight:700;color:#9d9d99;text-transform:uppercase;letter-spacing:.06em;margin:12px 0 6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:12px;padding:11px 12px;cursor:pointer;transition:opacity .15s}
.card.off{opacity:.4}
.ct{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:3px}
.pid{font-size:13px;font-weight:700}
.bdg{font-size:10px;font-weight:600;padding:2px 6px;border-radius:20px}
.bok{background:#e8f5e9;color:#2e7d32}.bw{background:#fff8e1;color:#b45309}.bdr{background:#fdecea;color:#c62828}.bn{background:#f1f1ef;color:#6b6b67}
.cult-line{font-size:11px;color:#6b6b67;margin-bottom:7px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px}
.sl{font-size:9px;color:#9d9d99;margin-bottom:1px}
.sv{font-size:12px;font-weight:600}.sv.red{color:#c62828}
.divl{border:none;border-top:1px solid rgba(0,0,0,.06);margin:6px 0}
.nx{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#6b6b67}
.dc{font-size:10px;font-weight:700;padding:2px 6px;border-radius:20px}

/* TOTALES */
.tots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px}
.tot{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:12px;padding:10px;text-align:center}
.tl{font-size:9px;color:#9d9d99;margin-bottom:3px}
.tv{font-size:18px;font-weight:700}
.tu{font-size:9px;color:#9d9d99;margin-top:1px}

/* CARGA */
.form-card{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:14px;padding:16px;margin-bottom:12px}
.ft{font-size:14px;font-weight:700;margin-bottom:14px}
.fl{display:block;font-size:11px;color:#6b6b67;margin-bottom:5px;font-weight:600}
.fi{width:100%;padding:10px 12px;border:1px solid rgba(0,0,0,.1);border-radius:9px;background:#f9f9f8;color:#1a1a18;font-size:14px;-webkit-appearance:none;margin-bottom:12px}
.sbtn{width:100%;padding:13px;background:#2563eb;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}
.ok-msg{background:#e8f5e9;color:#2e7d32;border-radius:10px;padding:12px;text-align:center;font-size:13px;font-weight:600;margin-top:10px}
.er-msg{background:#fdecea;color:#c62828;border-radius:10px;padding:12px;text-align:center;font-size:13px;margin-top:10px}
</style>
</head>
<body>

<div class="bar">
  <h1>🌱 Balance Hídrico — Grupo DH</h1>
  <div style="display:flex;align-items:center">
    <span class="upd" id="upd">—</span>
    <button class="btn" onclick="refresh()">↻</button>

</div>

<!-- MAPA -->
<div class="page on" id="pg-map">
  <div id="map-wrap">
    <img id="map-img" src="" alt="">
    <canvas id="map-canvas"></canvas>
    <div class="map-ctrl">
      <button onclick="zoom(1)">+</button>
      <button onclick="zoom(-1)">−</button>

    <div class="map-legend">

      <div class="leg-row"><div class="leg-dot" style="background:#c62828"></div>Regar ya</div>
      <div class="leg-row"><div class="leg-dot" style="background:#9d9d99"></div>Sin cultivo</div>

</div>

<!-- PIVOTS -->
<div class="page" id="pg-cards">
  <div class="scroll" id="cards-content">Cargando...</div>
</div>

<!-- CARGA -->
<div class="page" id="pg-carga">
  <div class="scroll">
    <div class="form-card">
      <div class="ft">Cargar Lluvia / Riego</div>
      <label class="fl">Pivot</label>
      <select class="fi" id="f-pivot">
        <option value="">Seleccioná...</option>
        <option>LA_R1</option><option>LA_R2</option><option>LE_RIEGO</option><option>LM_RIEGO</option>
        <option>EP_R1_A</option><option>EP_R1_B</option><option>EP_R1_C</option>
        <option>SJ_R2_A</option><option>SJ_R2_B</option><option>SJ_R2_C</option>
      </select>
      <label class="fl">Fecha</label>
      <input class="fi" type="date" id="f-fecha">
      <label class="fl">Lluvia (mm)</label>
      <input class="fi" type="number" id="f-lluvia" placeholder="0" min="0" step="0.1">
      <label class="fl">Riego aplicado (mm)</label>
      <input class="fi" type="number" id="f-riego" placeholder="0" min="0" step="0.1">
      <button class="sbtn" onclick="guardar()">Guardar</button>
      <div id="carga-msg"></div>
    </div>
    <p style="font-size:11px;color:#9d9d99;text-align:center">Los datos se guardan en Google Sheets.</p>
  </div>
</div>

<div class="tabs">
  <button class="tab on" id="t-map" onclick="goPage('map')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7l6-3 6 3 6-3v13l-6 3-6-3-6 3V7z"/><path d="M9 4v13M15 7v13"/></svg>Mapa
  </button>
  <button class="tab" id="t-cards" onclick="goPage('cards')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Pivots
  </button>
  <button class="tab" id="t-carga" onclick="goPage('carga')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12l7 7 7-7"/></svg>Cargar
  </button>
</div>

<script>
const CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vQ6R4wJj-1DpKka4Zd-0CPEi_JAHfDI7xZWcBcSgC4nJAW_7ex1S-r91elxNShPaQZswrANg7cw-ZKD/pub?gid=628155561&single=true&output=csv";

// Proyección del mapa: bounding box de la zona
const MAP_BOUNDS={minLat:-37.68,maxLat:-37.40,minLon:-62.00,maxLon:-61.54};

// Pivotes simples
const SINGLE={
  "LA_R1":{lat:-37.410993,lon:-61.938805,r:0.004},
  "LA_R2":{lat:-37.427284,lon:-61.944971,r:0.003},
  "LE_RIEGO":{lat:-37.651794,lon:-61.870594,r:0.004},
  "LM_RIEGO":{lat:-37.644442,lon:-61.864526,r:0.004},
};

// EP R1 — círculo dividido en 3 sectores
const EP={
  center:{lat:-37.454124,lon:-61.582570},r:0.007,
  sectors:[
    {id:"EP_R1_A",a0:-70,a1:50},
    {id:"EP_R1_C",a0:50,a1:170},
    {id:"EP_R1_B",a0:170,a1:290},
  ]
};

// SJ R2 — círculo con sector vacío
const SJ={
  center:{lat:-37.446073,lon:-61.608420},r:0.008,
  sectors:[
    {id:"SJ_R2_A",a0:-47,a1:73},
    {id:"SJ_R2_B",a0:73,a1:193},
    {id:"SJ_R2_C",a0:193,a1:313},
  ],
  empty:{a0:313,a1:413}
};

const ALL_IDS=[...Object.keys(SINGLE),...EP.sectors.map(s=>s.id),...SJ.sectors.map(s=>s.id)];

let pdata={}, zoomLvl=12, panX=0, panY=0;
let dragging=false, dragStart={x:0,y:0,px:0,py:0};

// ── CSV ────────────────────────────────────────────────────────────
function parseCSV(txt){
  const rows=[];let cur=[],f="",q=false;
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(q){if(c==='"'&&txt[i+1]==='"'){f+='"';i++;}else if(c==='"')q=false;else f+=c;}
    else{if(c==='"')q=true;else if(c===','){cur.push(f);f="";}else if(c==='\n'){cur.push(f);rows.push(cur);cur=[];f="";}else if(c!=='\r')f+=c;}
  }
  if(f||cur.length){cur.push(f);rows.push(cur);}
  return rows;
}

async function loadData(){
  try{
    const r=await fetch(CSV+"&nc="+Date.now());
    const txt=await r.text();
    pdata={};
    for(const row of parseCSV(txt)){
      const pid=(row[1]||"").trim();
      if(ALL_IDS.includes(pid))
        pdata[pid]={pid,cult:(row[3]||"").trim(),camp:(row[4]||"").trim(),
          ddc:(row[5]||"").trim(),est:(row[6]||"").trim(),au:(row[7]||"").trim(),
          pct:(row[8]||"").trim(),alerta:(row[9]||"").trim(),prox:(row[10]||"").trim(),dias:(row[11]||"").trim()};
    }
    document.getElementById("upd").textContent=new Date().toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
  }catch(e){console.error(e);}
}

// ── COLORES ────────────────────────────────────────────────────────
function aColor(a){
  if(!a||a==="—"||a==="")return"#9d9d99";
  if(a.includes("REGAR"))return"#c62828";
  if(a.includes("Pronto"))return"#d97706";
  return"#2e7d32";
}
function aAlpha(a){
  if(a&&a.includes("REGAR"))return.55;
  if(a&&a.includes("Pronto"))return.45;
  if(!a||a==="—"||a==="")return.2;
  return.3;
}

// ── PROYECCIÓN ─────────────────────────────────────────────────────
function latLonToXY(lat,lon,W,H){
  const scaleX=W/(MAP_BOUNDS.maxLon-MAP_BOUNDS.minLon);
  const scaleY=H/(MAP_BOUNDS.maxLat-MAP_BOUNDS.minLat);
  const scale=Math.min(scaleX,scaleY)*Math.pow(1.5,zoomLvl-12);
  const cx=W/2, cy=H/2;
  const centerLat=(MAP_BOUNDS.minLat+MAP_BOUNDS.maxLat)/2;
  const centerLon=(MAP_BOUNDS.minLon+MAP_BOUNDS.maxLon)/2;
  const x=cx+(lon-centerLon)*scale+panX;
  const y=cy-(lat-centerLat)*scale+panY;
  return{x,y,scale};
}

// ── DIBUJAR MAPA ───────────────────────────────────────────────────
let hitZones=[];

function drawMap(){
  const canvas=document.getElementById("map-canvas");
  const wrap=document.getElementById("map-wrap");
  canvas.width=wrap.clientWidth;
  canvas.height=wrap.clientHeight;
  const W=canvas.width, H=canvas.height;
  const ctx=canvas.getContext("2d");
  ctx.clearRect(0,0,W,H);
  hitZones=[];

  // Actualizar tile de mapa satelital
  const img=document.getElementById("map-img");
  const centerLat=(MAP_BOUNDS.minLat+MAP_BOUNDS.maxLat)/2;
  const centerLon=(MAP_BOUNDS.minLon+MAP_BOUNDS.maxLon)/2;
  const z=Math.min(14,zoomLvl+2);
  img.src=`https://mt0.google.com/vt/lyrs=s&x=${lonToTile(centerLon,z)}&y=${latToTile(centerLat,z)}&z=${z}`;
  img.style.display='block';

  function drawSector(centerLat,centerLon,rDeg,a0,a1,pid){
    const p=pdata[pid]||{pid,cult:"",alerta:""};
    const sin=!p.cult||p.cult.includes("Sin");
    const col=sin?"#9d9d99":aColor(p.alerta);
    const alpha=sin?0.15:aAlpha(p.alerta);
    const {x,y,scale}=latLonToXY(centerLat,centerLon,W,H);
    const rx=rDeg*scale*Math.cos(centerLat*Math.PI/180)*0.85;
    const ry=rDeg*scale;

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x,y);
    const steps=48;
    for(let i=0;i<=steps;i++){
      const angle=(a0+(a1-a0)*i/steps-90)*Math.PI/180;
      ctx.lineTo(x+rx*Math.cos(angle), y+ry*Math.sin(angle));
    }
    ctx.closePath();
    ctx.fillStyle=col;ctx.globalAlpha=alpha;ctx.fill();
    ctx.globalAlpha=1;ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.stroke();
    ctx.restore();

    // Label
    const midA=((a0+a1)/2-90)*Math.PI/180;
    const lx=x+rx*0.6*Math.cos(midA);
    const ly=y+ry*0.6*Math.sin(midA);
    ctx.save();
    ctx.font="bold 9px -apple-system,sans-serif";
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillStyle="#fff";
    ctx.shadowColor="rgba(0,0,0,.6)";ctx.shadowBlur=3;
    ctx.fillText(pid,lx,ly);
    ctx.restore();

    // Zona de hit
    hitZones.push({type:"sector",x,y,rx,ry,a0,a1,pid});
  }

  function drawCircle(lat,lon,rDeg,pid){
    const p=pdata[pid]||{pid,cult:"",alerta:""};
    const sin=!p.cult||p.cult.includes("Sin");
    const col=sin?"#9d9d99":aColor(p.alerta);
    const alpha=sin?0.15:aAlpha(p.alerta);
    const {x,y,scale}=latLonToXY(lat,lon,W,H);
    const rx=rDeg*scale*Math.cos(lat*Math.PI/180)*0.85;
    const ry=rDeg*scale;

    ctx.save();
    ctx.beginPath();
    ctx.ellipse(x,y,rx,ry,0,0,2*Math.PI);
    ctx.fillStyle=col;ctx.globalAlpha=alpha;ctx.fill();
    ctx.globalAlpha=1;ctx.strokeStyle="#fff";ctx.lineWidth=2.5;ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.font="bold 10px -apple-system,sans-serif";
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillStyle="#fff";ctx.shadowColor="rgba(0,0,0,.7)";ctx.shadowBlur=3;
    ctx.fillText(pid,x,y);
    ctx.restore();

    hitZones.push({type:"circle",x,y,rx,ry,pid});
  }

  // Dibujar pivotes simples
  Object.entries(SINGLE).forEach(([pid,cfg])=>drawCircle(cfg.lat,cfg.lon,cfg.r,pid));

  // EP R1
  EP.sectors.forEach(s=>drawSector(EP.center.lat,EP.center.lon,EP.r,s.a0,s.a1,s.id));

  // SJ R2 — sectores
  SJ.sectors.forEach(s=>drawSector(SJ.center.lat,SJ.center.lon,SJ.r,s.a0,s.a1,s.id));
  // Sector vacío
  const {x:sjx,y:sjy,scale:sjs}=latLonToXY(SJ.center.lat,SJ.center.lon,W,H);
  const sjrx=SJ.r*sjs*Math.cos(SJ.center.lat*Math.PI/180)*0.85;
  const sjry=SJ.r*sjs;
  ctx.save();
  ctx.beginPath();ctx.moveTo(sjx,sjy);
  for(let i=0;i<=32;i++){
    const a=(SJ.empty.a0+(SJ.empty.a1-SJ.empty.a0)*i/32-90)*Math.PI/180;
    ctx.lineTo(sjx+sjrx*Math.cos(a),sjy+sjry*Math.sin(a));
  }
  ctx.closePath();
  ctx.fillStyle="#9d9d99";ctx.globalAlpha=.12;ctx.fill();
  ctx.globalAlpha=1;ctx.setLineDash([4,4]);ctx.strokeStyle="#fff";ctx.lineWidth=1.5;ctx.stroke();
  ctx.restore();
}

// Tile helpers
function lonToTile(lon,z){return Math.floor((lon+180)/360*Math.pow(2,z));}
function latToTile(lat,z){
  const r=lat*Math.PI/180;
  return Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*Math.pow(2,z));
}

// ── INTERACCIÓN MAPA ───────────────────────────────────────────────
function hitTest(cx,cy){
  for(const z of hitZones){
    if(z.type==="circle"){
      const dx=(cx-z.x)/z.rx, dy=(cy-z.y)/z.ry;
      if(dx*dx+dy*dy<=1) return z.pid;
    } else {
      const dx=cx-z.x, dy=cy-z.y;
      const angle=(Math.atan2(dy/z.ry,dx/z.rx)*180/Math.PI+90+360)%360;
      const a0m=(z.a0+360)%360, a1m=(z.a1+360)%360;
      const inAngle=a1m>a0m?(angle>=a0m&&angle<=a1m):(angle>=a0m||angle<=a1m);
      const rx2=z.rx*z.rx,ry2=z.ry*z.ry;
      const inEllipse=(dx*dx/rx2+dy*dy/ry2)<=1;
      if(inEllipse&&inAngle) return z.pid;
    }
  }
  return null;
}

const canvas=document.getElementById("map-canvas");
const tooltip=document.getElementById("tooltip");

canvas.addEventListener("click",e=>{
  const rect=canvas.getBoundingClientRect();
  const pid=hitTest(e.clientX-rect.left,e.clientY-rect.top);
  if(!pid){tooltip.style.display="none";return;}
  showTooltip(pid,e.clientX-rect.left,e.clientY-rect.top);
});

canvas.addEventListener("mousedown",e=>{
  dragging=true;dragStart={x:e.clientX,y:e.clientY,px:panX,py:panY};
});
canvas.addEventListener("mousemove",e=>{
  if(!dragging) return;
  panX=dragStart.px+(e.clientX-dragStart.x);
  panY=dragStart.py+(e.clientY-dragStart.y);
  drawMap();
});
canvas.addEventListener("mouseup",()=>dragging=false);
canvas.addEventListener("touchstart",e=>{
  if(e.touches.length===1){
    dragging=true;
    dragStart={x:e.touches[0].clientX,y:e.touches[0].clientY,px:panX,py:panY};
  }
},{passive:true});
canvas.addEventListener("touchmove",e=>{
  if(!dragging||e.touches.length!==1) return;
  panX=dragStart.px+(e.touches[0].clientX-dragStart.x);
  panY=dragStart.py+(e.touches[0].clientY-dragStart.y);
  drawMap();
  e.preventDefault();
},{passive:false});
canvas.addEventListener("touchend",e=>{
  dragging=false;
  if(e.changedTouches.length===1&&Math.abs(panX-dragStart.px)<5&&Math.abs(panY-dragStart.py)<5){
    const rect=canvas.getBoundingClientRect();
    const t=e.changedTouches[0];
    const pid=hitTest(t.clientX-rect.left,t.clientY-rect.top);
    if(pid) showTooltip(pid,t.clientX-rect.left,t.clientY-rect.top);
    else tooltip.style.display="none";
  }
});

function showTooltip(pid,tx,ty){
  const p=pdata[pid]||{pid,cult:"",alerta:""};
  const sin=!p.cult||p.cult.includes("Sin")||p.cult==="—";
  tooltip.innerHTML=`<div class="tt-title">${pid}</div>
    <div class="tt-cult">${sin?"Sin cultivo":p.cult+(p.ddc?" · DDC "+p.ddc:"")}</div>
    ${sin?"":` 
    <div class="tt-row"><span class="tt-lbl">AU disp.</span><span>${p.au||"—"} mm</span></div>
    <div class="tt-row"><span class="tt-lbl">% AU</span><span>${p.pct||"—"}</span></div>
    <div class="tt-row"><span class="tt-lbl">Estadio</span><span>${p.est||"—"}</span></div>
    <div class="tt-row"><span class="tt-lbl">Prox. riego</span><span>${p.prox||"—"}</span></div>
    <div class="tt-row"><span class="tt-lbl">Días</span><span>${p.dias||"—"}</span></div>`}`;
  const W=canvas.width, H=canvas.height;
  const tw=180, th=tooltip.offsetHeight||140;
  tooltip.style.left=Math.min(tx+8,W-tw-8)+"px";
  tooltip.style.top=Math.min(ty-10,H-th-8)+"px";
  tooltip.style.display="block";
}

function zoom(d){
  zoomLvl=Math.max(10,Math.min(16,zoomLvl+d));
  drawMap();
}

// ── TARJETAS ───────────────────────────────────────────────────────
const CAMPOS={
  "La Alcancia":["LA_R1","LA_R2"],
  "La Esquina Biodes":["LE_RIEGO"],
  "La Medialuna":["LM_RIEGO"],
  "San Justo EP R1":["EP_R1_A","EP_R1_B","EP_R1_C"],
  "San Justo R2":["SJ_R2_A","SJ_R2_B","SJ_R2_C"]
};

function bdg(a){
  if(!a||a==="—")return'<span class="bdg bn">Sin siembra</span>';
  if(a.includes("REGAR"))return'<span class="bdg bdr">Regar ya</span>';
  if(a.includes("Pronto"))return'<span class="bdg bw">Pronto</span>';
  return'<span class="bdg bok">OK</span>';
}
function dc(d){
  if(!d||d==="—")return'<span class="dc bn">—</span>';
  const n=parseInt(d);
  if(isNaN(n)||n<=0)return'<span class="dc bdr">Vencido</span>';
  if(n<=7)return'<span class="dc bw">'+n+"d</span>";
  return'<span class="dc bok">'+n+"d</span>";
}

function renderCards(){
  const act=Object.values(pdata).filter(p=>p.cult&&!p.cult.includes("Sin")&&p.cult!=="—");
  const al=act.filter(p=>p.alerta.includes("REGAR")).length;
  let html=`<div class="tots">
    <div class="tot"><div class="tl">Activos</div><div class="tv">${act.length}</div><div class="tu">pivots</div></div>
    <div class="tot"><div class="tl">Estado</div><div class="tv" style="font-size:13px">${al===0?"🟢 OK":"🔴 "+al}</div></div>
    <div class="tot"><div class="tl">Alertas</div><div class="tv" style="color:${al>0?"#c62828":"#2e7d32"}">${al}</div><div class="tu">a regar</div></div>
  </div>`;
  for(const[campo,pids] of Object.entries(CAMPOS)){
    html+=`<div class="clbl">${campo}</div><div class="grid">`;
    pids.forEach(pid=>{
      const p=pdata[pid]||{pid,cult:"",alerta:""};
      const sin=!p.cult||p.cult.includes("Sin")||p.cult==="—";
      const pN=parseFloat((p.pct||"0").replace(",",".").replace("%",""));
      html+=`<div class="card${sin?" off":""}" onclick="focusPivot('${pid}')">
        <div class="ct"><span class="pid">${pid}</span>${bdg(p.alerta)}</div>
        <div class="cult-line">${sin?"Sin cultivo":p.cult+(p.ddc?" · DDC "+p.ddc:"")}</div>
        ${sin?"":`<div class="stats">
          <div><div class="sl">AU disp.</div><div class="sv${pN>0&&pN<45?" red":""}">${p.au||"—"} mm</div></div>
          <div><div class="sl">% AU</div><div class="sv${pN>0&&pN<45?" red":""}">${p.pct||"—"}</div></div>
        </div><div class="divl"></div>
        <div class="nx"><span>${p.prox||"—"}</span>${dc(p.dias)}</div>`}
      </div>`;
    });
    html+=`</div>`;
  }
  document.getElementById("cards-content").innerHTML=html;
}

function focusPivot(pid){
  goPage("map");
  tooltip.style.display="none";
  panX=0;panY=0;
  drawMap();
}

// ── CARGA ──────────────────────────────────────────────────────────
function setToday(){
  const d=new Date();
  document.getElementById("f-fecha").value=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

async function guardar(){
  const pivot=document.getElementById("f-pivot").value;
  const fecha=document.getElementById("f-fecha").value;
  const lluvia=parseFloat(document.getElementById("f-lluvia").value)||0;
  const riego=parseFloat(document.getElementById("f-riego").value)||0;
  const msg=document.getElementById("carga-msg");
  if(!pivot){msg.innerHTML='<div class="er-msg">Seleccioná un pivot</div>';return;}
  if(!fecha){msg.innerHTML='<div class="er-msg">Ingresá una fecha</div>';return;}
  if(!lluvia&&!riego){msg.innerHTML='<div class="er-msg">Ingresá lluvia o riego</div>';return;}
  msg.innerHTML=`<div class="ok-msg">✅ ${pivot} — ${fecha}<br>Lluvia: ${lluvia}mm · Riego: ${riego}mm<br><small>Ingresá estos datos en col H/I del Sheets</small></div>`;
}

// ── NAV ────────────────────────────────────────────────────────────
function goPage(name){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("on"));
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("on"));
  document.getElementById("pg-"+name).classList.add("on");
  document.getElementById("t-"+name).classList.add("on");
  tooltip.style.display="none";
  if(name==="map") setTimeout(drawMap,50);
}

// ── INICIO ─────────────────────────────────────────────────────────
async function refresh(){
  await loadData();
  renderCards();
  drawMap();
}

window.addEventListener("resize",drawMap);
setToday();
refresh();
</script>
</body>
</html>
